name: Atualizar calendário da Agenda Eletrônica SP

on:
  push:
    branches: [main]
  schedule:
    # Todos os dias às 07:17 UTC (04:17 no horário de Brasília).
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agenda-eletronica-sp-feed
  cancel-in-progress: false

jobs:
  atualizar-calendario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Consultar o site e gerar .ics
        run: python build_calendar.py

      - name: Testes automatizados e validação iCalendar
        run: python -m pytest -q

      - name: Análise estática (Ruff)
        run: python -m ruff check build_calendar.py tests

      - name: Registrar atualização no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda-eletronica-sp.ics
          if git diff --cached --quiet; then
            echo "O calendário não mudou; nenhuma alteração para registrar."
          else
            git commit -m "Atualiza feed de festas SP"
            git pull --rebase origin main
            git push
          fi
